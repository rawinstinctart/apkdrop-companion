plugins { id "com.android.application" }

android {
    namespace "de.rawinstinctai.apkdrop"
    compileSdk 36

    defaultConfig {
        applicationId "de.rawinstinctai.apkdrop"
        minSdk 26
        targetSdk 36
        versionCode 17
        versionName "0.1.0-alpha.14"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all { systemProperty "apkdrop.preview.dir", new File(rootProject.projectDir, "app/build/reports/ui").absolutePath }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            // Release signing stays external. Never commit a keystore or password.
        }
        preview {
            initWith release
            // Keep the installed alpha package and original signer for in-place upgrades.
            applicationIdSuffix ".debug"
            versionNameSuffix "-preview"
            debuggable false
            signingConfig null
        }
    }
}

dependencies {
    implementation "com.android.tools.build:apksig:8.13.2"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    testImplementation "org.robolectric:robolectric:4.17"
}


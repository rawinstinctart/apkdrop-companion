name: Export Android build tools for local signing

on:
  pull_request:
    paths:
      - '.github/workflows/signing-toolchain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install official Android build tools
        run: sdkmanager 'build-tools;35.0.0'
      - name: Bundle tools without signing secrets
        run: |
          mkdir -p toolchain/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" toolchain/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" toolchain/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt" toolchain/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" toolchain/lib/
          find toolchain -type f -maxdepth 2 -printf '%p %s bytes\n'
      - uses: actions/upload-artifact@v4
        with:
          name: official-android-build-tools-35-local-signing
          path: toolchain/
          if-no-files-found: error
          retention-days: 1

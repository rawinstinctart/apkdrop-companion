name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'release/*-notes.md'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: companion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Reject internal QA notes in public release copy
        run: python3 scripts/public-release-notes.py

      - name: Test release artifact gates
        run: python3 -m unittest discover -s scripts/tests -v

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # Legacy 'tools' no longer exists in Google's SDK repository.
          packages: ''

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Test, lint and build unsigned debug candidate
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug -I scripts/unsigned-debug.init.gradle

      - name: Test, lint and build unsigned non-debuggable preview
        run: gradle --no-daemon :app:testPreviewUnitTest :app:lintPreview :app:assemblePreview

      - name: Check preview APK manifest (unsigned candidate only)
        run: |
          python3 - <<'PY'
          import importlib.util, os, pathlib, subprocess
          spec = importlib.util.spec_from_file_location('preflight', 'scripts/release-preflight.py')
          p = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(p)
          apks = list(pathlib.Path('app/build/outputs/apk/preview').glob('*.apk'))
          if len(apks) != 1:
              raise SystemExit('Exactly one preview candidate is required.')
          aapt = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools/35.0.0/aapt'
          actual = p.manifest_facts(subprocess.check_output([str(aapt), 'dump', 'badging', str(apks[0])], text=True))
          expected = p.policy('alpha23-preview')
          expected.pop('certificateSha256')  # CI never signs or certifies the APK.
          expected.update(minSdk=26, targetSdk=36, permissions=sorted(p.COMPANION_PERMISSIONS))
          if any(actual.get(key) != value for key, value in expected.items()):
              raise SystemExit('Preview manifest differs from the pinned identity/permissions: ' + str(actual))
          print('Unsigned preview metadata passed; original-key signing and device acceptance remain open.')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: apkdrop-companion-unsigned-preview
          path: app/build/outputs/apk/preview/*.apk
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: apkdrop-companion-unsigned-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7


      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/ui/
            app/build/reports/lint-results-debug.*
            app/build/reports/lint-results-preview.*
          retention-days: 7


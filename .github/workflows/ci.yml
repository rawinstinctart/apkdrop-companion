name: Android CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: companion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Test release artifact gates
        run: python3 -m unittest discover -s scripts/tests -v

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Test, lint and build unsigned debug candidate
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug -I scripts/unsigned-debug.init.gradle

      - uses: actions/upload-artifact@v4
        with:
          name: apkdrop-companion-unsigned-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7


      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          retention-days: 7


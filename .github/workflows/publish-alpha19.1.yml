name: Publish original-signed Alpha 19.1 Entdecken ohne Button-Flut

on:
  pull_request:
    paths:
      - '.github/workflows/publish-alpha19.1.yml'
      - 'release/alpha19.1-signature.json'
      - 'release/reconstruct-signed.py'
      - 'release/alpha19.1-notes.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-alpha19.1.yml'

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Pin passing Android candidate source and checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/${{ github.repository }}/actions/runs/37992004831 --jq .head_sha)" = '7dbe3033bd3e7dca49314d978fc8e5a1944f4476'
          test "$(gh api repos/${{ github.repository }}/actions/runs/37992004831 --jq .conclusion)" = 'success'
          test "$(gh api repos/${{ github.repository }}/git/trees/$GITHUB_SHA --jq '.tree[] | select(.path == "app") | .sha')" = "$(gh api repos/${{ github.repository }}/git/trees/7dbe3033bd3e7dca49314d978fc8e5a1944f4476 --jq '.tree[] | select(.path == "app") | .sha')"
      - name: Download exact tested Alpha 19.1 unsigned preview candidate
        uses: actions/download-artifact@v4
        with:
          run-id: 37992004831
          name: apkdrop-companion-unsigned-preview
          path: unsigned
          github-token: ${{ github.token }}
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install pinned official Android build tools
        run: sdkmanager 'build-tools;35.0.0'
      - name: Reconstruct and verify locally original-signed APK
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME/build-tools/35.0.0"
          test -f unsigned/app-preview-unsigned.apk
          echo 'f2cd2b56b108dd2e3baec39726af5d590fd33897466da07ee49df4efe7294f63  unsigned/app-preview-unsigned.apk' | sha256sum -c -
          mkdir -p dist
          python3 release/reconstruct-signed.py unsigned/app-preview-unsigned.apk release/alpha19.1-signature.json dist/APKDrop-Companion-v0.1.0-alpha.19.1-preview.apk
          "$sdk/apksigner" verify --verbose --print-certs dist/APKDrop-Companion-v0.1.0-alpha.19.1-preview.apk > /tmp/alpha19.1-signature.txt
          grep -q '^Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/alpha19.1-signature.txt
          grep -q '^Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/alpha19.1-signature.txt
          grep -q '^Number of signers: 1' /tmp/alpha19.1-signature.txt
          grep -q '^Signer #1 certificate SHA-256 digest: 6cf70241a63498e5e9fce78bac9abec760364cf320928347114bf109abd81e2e' /tmp/alpha19.1-signature.txt
          "$sdk/aapt" dump badging dist/APKDrop-Companion-v0.1.0-alpha.19.1-preview.apk > /tmp/alpha19.1-manifest.txt
          grep -q "package: name='de.rawinstinctai.apkdrop.debug' versionCode='26' versionName='0.1.0-alpha.19.1-preview'" /tmp/alpha19.1-manifest.txt
          grep -q "^sdkVersion:'26'" /tmp/alpha19.1-manifest.txt
          grep -q "^targetSdkVersion:'36'" /tmp/alpha19.1-manifest.txt
          ! grep -q '^application-debuggable' /tmp/alpha19.1-manifest.txt
          "$sdk/zipalign" -c 4 dist/APKDrop-Companion-v0.1.0-alpha.19.1-preview.apk
          echo '459b55c7240649882c00fa68c5e051977b447a9cfb437123d4ca6f707d66b2a0  dist/APKDrop-Companion-v0.1.0-alpha.19.1-preview.apk' | sha256sum -c -
          test "$(wc -c < dist/APKDrop-Companion-v0.1.0-alpha.19.1-preview.apk)" -eq 337359
          python3 scripts/release-preflight.py dist/APKDrop-Companion-v0.1.0-alpha.19.1-preview.apk --profile alpha19.1-preview --sdk "$ANDROID_HOME"
          echo 'ORIGINAL-SIGNED ALPHA 19.1 VERIFIED'
      - name: Verify deployed APKDrop backend boundaries
        run: python3 release/verify-alpha15-backend.py
      - uses: actions/upload-artifact@v4
        with:
          name: original-signed-alpha19.1-reviewed
          path: dist/APKDrop-Companion-v0.1.0-alpha.19.1-preview.apk
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: original-signed-alpha19.1-reviewed
          path: dist
      - name: Publish prerelease and re-download for byte proof
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='v0.1.0-alpha.19.1'
          APK='dist/APKDrop-Companion-v0.1.0-alpha.19.1-preview.apk'
          test -f "$APK"
          python3 scripts/public-release-notes.py release/alpha19.1-notes.md
          ! gh release view "$TAG" >/dev/null 2>&1
          echo "459b55c7240649882c00fa68c5e051977b447a9cfb437123d4ca6f707d66b2a0  $APK" | sha256sum -c -
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title 'APKDrop Companion Alpha 19.1 — Entdecken ohne Button-Flut' --notes-file release/alpha19.1-notes.md --prerelease
          mkdir -p /tmp/alpha19.1-download-proof
          gh release download "$TAG" --pattern 'APKDrop-Companion-v0.1.0-alpha.19.1-preview.apk' --dir /tmp/alpha19.1-download-proof
          echo '459b55c7240649882c00fa68c5e051977b447a9cfb437123d4ca6f707d66b2a0  /tmp/alpha19.1-download-proof/APKDrop-Companion-v0.1.0-alpha.19.1-preview.apk' | sha256sum -c -
          echo 'PUBLISHED SIGNED ALPHA 19.1 VERIFIED'

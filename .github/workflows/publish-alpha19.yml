name: Publish original-signed Alpha 19 Pro experience

on:
  pull_request:
    paths:
      - '.github/workflows/publish-alpha19.yml'
      - 'release/alpha19-signature.json'
      - 'release/reconstruct-signed.py'
      - 'release/alpha19-notes.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-alpha19.yml'

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Pin passing Android candidate source and checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/${{ github.repository }}/actions/runs/37987326095 --jq .head_sha)" = '01902d79078dd81c64fdda512da8aeb69031f3ea'
          test "$(gh api repos/${{ github.repository }}/actions/runs/37987326095 --jq .conclusion)" = 'success'
      - name: Download exact tested Alpha 19 unsigned preview candidate
        uses: actions/download-artifact@v4
        with:
          run-id: 37987326095
          name: apkdrop-companion-unsigned-preview
          path: unsigned
          github-token: ${{ github.token }}
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install pinned official Android build tools
        run: sdkmanager 'build-tools;35.0.0'
      - name: Reconstruct and verify locally original-signed APK
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME/build-tools/35.0.0"
          test -f unsigned/app-preview-unsigned.apk
          echo 'a10f66da6532d83a684602b6e84fb5d45050c2402e0a54f93aa833337bcf5a9b  unsigned/app-preview-unsigned.apk' | sha256sum -c -
          mkdir -p dist
          python3 release/reconstruct-signed.py unsigned/app-preview-unsigned.apk release/alpha19-signature.json dist/APKDrop-Companion-v0.1.0-alpha.19-preview.apk
          "$sdk/apksigner" verify --verbose --print-certs dist/APKDrop-Companion-v0.1.0-alpha.19-preview.apk > /tmp/alpha19-signature.txt
          grep -q '^Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/alpha19-signature.txt
          grep -q '^Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/alpha19-signature.txt
          grep -q '^Number of signers: 1' /tmp/alpha19-signature.txt
          grep -q '^Signer #1 certificate SHA-256 digest: 6cf70241a63498e5e9fce78bac9abec760364cf320928347114bf109abd81e2e' /tmp/alpha19-signature.txt
          "$sdk/aapt" dump badging dist/APKDrop-Companion-v0.1.0-alpha.19-preview.apk > /tmp/alpha19-manifest.txt
          grep -q "package: name='de.rawinstinctai.apkdrop.debug' versionCode='25' versionName='0.1.0-alpha.19-preview'" /tmp/alpha19-manifest.txt
          grep -q "^sdkVersion:'26'" /tmp/alpha19-manifest.txt
          grep -q "^targetSdkVersion:'36'" /tmp/alpha19-manifest.txt
          ! grep -q '^application-debuggable' /tmp/alpha19-manifest.txt
          "$sdk/zipalign" -c 4 dist/APKDrop-Companion-v0.1.0-alpha.19-preview.apk
          echo '470eac1b263a25b9cc30cfa89cf3c50b4b74d0e08a886362c6f8eccd2f03d6bc  dist/APKDrop-Companion-v0.1.0-alpha.19-preview.apk' | sha256sum -c -
          test "$(wc -c < dist/APKDrop-Companion-v0.1.0-alpha.19-preview.apk)" -eq 333263
          python3 scripts/release-preflight.py dist/APKDrop-Companion-v0.1.0-alpha.19-preview.apk --profile alpha19-preview --sdk "$ANDROID_HOME"
          echo 'ORIGINAL-SIGNED ALPHA 19 VERIFIED'
      - name: Verify deployed APKDrop backend boundaries
        run: python3 release/verify-alpha15-backend.py
      - uses: actions/upload-artifact@v4
        with:
          name: original-signed-alpha19-reviewed
          path: dist/APKDrop-Companion-v0.1.0-alpha.19-preview.apk
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: original-signed-alpha19-reviewed
          path: dist
      - name: Publish prerelease and re-download for byte proof
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='v0.1.0-alpha.19'
          APK='dist/APKDrop-Companion-v0.1.0-alpha.19-preview.apk'
          test -f "$APK"
          python3 scripts/public-release-notes.py release/alpha19-notes.md
          ! gh release view "$TAG" >/dev/null 2>&1
          echo "470eac1b263a25b9cc30cfa89cf3c50b4b74d0e08a886362c6f8eccd2f03d6bc  $APK" | sha256sum -c -
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title 'APKDrop Companion Alpha 19 — Pro experience' --notes-file release/alpha19-notes.md --prerelease
          mkdir -p /tmp/alpha19-download-proof
          gh release download "$TAG" --pattern 'APKDrop-Companion-v0.1.0-alpha.19-preview.apk' --dir /tmp/alpha19-download-proof
          echo '470eac1b263a25b9cc30cfa89cf3c50b4b74d0e08a886362c6f8eccd2f03d6bc  /tmp/alpha19-download-proof/APKDrop-Companion-v0.1.0-alpha.19-preview.apk' | sha256sum -c -
          echo 'PUBLISHED SIGNED ALPHA 19 VERIFIED'
